<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Сайт с цитатами</title>

    <!-- Подключаем Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5">

    <!-- Заголовок -->
    <div class="text-center mb-5">
        <h1 class="fw-bold">Цитаты знаменитых людей</h1>
        <p class="text-muted">Введите количество цитат, которые хотите получить</p>
    </div>

    <!-- Форма -->
    <div class="row justify-content-center">
        <div class="col-md-6">
            <form method="POST" class="card p-4 shadow-sm">

                <div class="mb-3">
                    <input
                        type="number"
                        name="quote_quantity"
                        class="form-control"
                        placeholder="Введите количество цитат"
                        required>
                </div>

                <button type="submit" class="btn btn-primary w-100">
                    Выдать цитаты
                </button>

            </form>
        </div>
    </div>

    <!-- Результаты -->
    {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    {% if result %}
    <div class="mt-5">

        <h2 class="text-center mb-4">
            Выводим {{ quantity_quates }} цитат
        </h2>

        <div class="row g-4">
            {% for item in result %}
            <div class="col-md-6">

                <div class="card h-100 shadow-sm">
                    <div class="card-body">

                        <p class="card-text fst-italic">
                            "{{ item['quote'] }}"
                        </p>

                        <p class="text-end fw-bold text-muted">
                            — {{ item['author'] }}
                        </p>

                    </div>
                </div>

            </div>
            {% endfor %}
        </div>

    </div>
    {% endif %}




</div>

</body>
</html>
